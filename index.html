<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="XI55njDX2gu9wrLq5PrFZczEwzv1jG_eaftykFcm1Zs" />
    <title>AIGC 工作台</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/pixel-aigc-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('pixel:theme-mode') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var storedLocale = localStorage.getItem('pixel:locale');
          var locale = (storedLocale === 'zh-CN' || storedLocale === 'en-US') ? storedLocale : '';
          if (!locale) {
            var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'zh-CN']);
            locale = /^zh\b/i.test(String(langs[0] || '')) ? 'zh-CN' : 'en-US';
          }
          document.documentElement.lang = locale;
          if (locale === 'en-US') document.title = 'AIGC Workbench';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
